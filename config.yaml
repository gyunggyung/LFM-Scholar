# LFM-CiteAgent Configuration

# External API Keys using Environment Variables is recommended, but can be set here
semantic_scholar_api_key: "" 

# Model Configuration
model:
  type: "gguf" # 'transformers' or 'gguf'
  
  # Model Variant Selection: 'lfm2' or 'lfm2.5'
  # - lfm2: Fine-tuned LFM2-2.6B-Exp (your custom model)
  # - lfm2.5: Official LFM2.5-1.2B-Instruct (faster, more pretraining)
  variant: "lfm2"  # Default to fine-tuned model
  
  # LFM2 (Fine-tuned by gyung) - 2.6B params, 10T tokens
  lfm2:
    base: "gyung/LFM-CiteAgent-2.6B-GGUF"
    file: "LFM2-2.6B-Exp.Q4_K_M.gguf"
    generation:
      temperature: 0.3
      min_p: 0.15
      repetition_penalty: 1.05
  
  # LFM2.5 (Fine-tuned by gyung) - 1.2B params, 28T tokens, faster inference
  lfm2.5:
    base: "gyung/LFM2.5-CiteAgent-1.2B-v1-GGUF"
    file: "LFM2.5-1.2B-Instruct.Q4_K_M.gguf"
    generation:
      temperature: 0.1
      top_k: 50
      top_p: 0.1
      repetition_penalty: 1.05
  
  max_length: 2048

# Search Configuration
search:
  top_k: 20
  min_citations: 10
  year_min: 2020
  # Search engine priority (fallback order)
  engines:
    - semantic_scholar  # Best quality, has rate limits
    - openalex          # No rate limit, good coverage
    - arxiv             # Latest preprints, real-time

# Generation Configuration
generation:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 1024
